<header class="top"><div class="brand"><img src="icon-192.png" alt="SRI SQUARE"><div><h1>SRI SQUARE</h1><p>ACCOUNTS</p></div></div></header>
<div class="wrap"><button class="menuBtn" onclick="openMenu()">☰ &nbsp; Menu</button><main id="app"></main></div>
<div id="menu" class="menuShade hidden" onclick="if(event.target.id==='menu')closeMenu()"><aside class="sheet"><button class="secondary" style="width:100%" onclick="closeMenu();home()">⌂ Home</button><h2>Menu</h2><button type="button" class="menuItem" data-action="new-booking" onclick="return openNewBooking(event,true)">＋ New Booking</button><button class="menuItem" onclick="closeMenu();bookings()">📋 Bookings</button><button class="menuItem" onclick="closeMenu();customers()">👥 Customers</button><button class="menuItem" onclick="closeMenu();billing()">₹ Customer Billing</button><button class="menuItem" onclick="closeMenu();finance()">▤ Financial</button><button class="menuItem" onclick="closeMenu();cash()">💵 Cash Balance</button><button class="menuItem" onclick="backup()">⬇ Backup Data</button><button class="menuItem" onclick="restore()">⬆ Restore Data</button></aside></div>
<input id="restoreInput" type="file" accept=".json,application/json" class="hidden" onchange="restoreFile(event)"><div id="modal" class="modal hidden"></div>
<script>
const KEY='SRI_SQUARE_ACCOUNTS_FRESH_2026';let db=load();
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.bookings)){x.cashLedger=Array.isArray(x.cashLedger)?x.cashLedger:[];return x}return{bookings:[],cashLedger:[]}}catch(e){return{bookings:[],cashLedger:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function $(id){return document.getElementById(id)}function E(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function N(v){return Number(v)||0}function M(v){return '₹'+Math.round(N(v)).toLocaleString('en-IN')}function modes(sel){return ['Cash','UPI','Company Account'].map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}function openMenu(){$('menu').classList.remove('hidden')}function closeMenu(){$('menu').classList.add('hidden')}function bar(t){return `<div class="homebar"><button class="secondary" onclick="home()">← Back</button><h2>${t}</h2><button class="secondary" onclick="home()">⌂ Home</button></div>`}
function bill(b){return N(b.rent)+N(b.water)+N(b.power)*18+(b.other||[]).reduce((s,x)=>s+N(x.amount),0)}function isFinanceIncome(x){return x&&(x.financeIncome===true||x.financeIncome==='true'||x.financeIncome===1||x.financeIncome==='1'||x.finance===true||x.includeFinance===true||x.income===true)}
function financeOther(b){return (b.other||[]).filter(isFinanceIncome).reduce((s,x)=>s+N(x.amount),0)}function received(b){return N(b.a1)+N(b.a2)+(b.cleared?N(b.final):0)}function cashIn(b){let x=0;if(b.m1==='Cash')x+=N(b.a1);if(b.m2==='Cash')x+=N(b.a2);if(b.cleared&&b.finalMode==='Cash')x+=N(b.final);return x}
function openNewBooking(e,fromMenu){if(e){e.preventDefault();e.stopPropagation()}if(fromMenu)closeMenu();newBooking();return false}
function home(){let bs=db.bookings,d=bs.reduce((s,b)=>s+Math.max(0,bill(b)-received(b)),0),entries=Array.isArray(db.cashLedger)?db.cashLedger:[],cashBalance=entries.reduce((s,x)=>s+N(x.credit)-N(x.debit),0),debitTotal=entries.reduce((s,x)=>s+N(x.debit),0);$('app').innerHTML=`<section class="hero"><small>SRI SQUARE</small><h2>Accounts Dashboard</h2><p>Bookings · Customer Billing · Cash · Financial</p></section><div class="stats"><div class="stat"><label>📅 Total Bookings</label><b>${bs.length}</b><small>All bookings</small></div><div class="stat"><label>📌 Balance Due</label><b>${M(d)}</b><small>Customer pending</small></div><div class="stat"><label>💵 Cash Balance</label><b>${M(cashBalance)}</b><small>Manual cash ledger</small></div><div class="stat"><label>💸 Total Debits</label><b>${M(debitTotal)}</b><small>Cash expenses</small></div></div><div class="title">Quick Actions</div><div class="actions"><button type="button" class="action" data-action="new-booking" onclick="return openNewBooking(event,false)"><div class="ico">＋</div>New Booking<small>Create booking</small></button><button class="action" onclick="bookings()"><div class="ico">📋</div>Bookings<small>View all</small></button><button class="action" onclick="customers()"><div class="ico">👥</div>Customers<small>Contacts</small></button><button class="action" onclick="billing()"><div class="ico">₹</div>Billing<small>Customer bill</small></button><button class="action" onclick="finance()"><div class="ico">▤</div>Financial<small>Internal only</small></button><button class="action" onclick="cash()"><div class="ico">💵</div>Cash Balance<small>Cash position</small></button></div><div class="card"><div class="title" style="margin-top:0">Recent Bookings</div>${bs.length?bs.slice().reverse().slice(0,5).map(b=>`<div class="item" style="margin-bottom:9px" onclick="openBooking('${E(b.id)}')"><div class="row"><b>${E(b.id)} — ${E(b.customer)}</b><b>${E(b.date)}</b></div><div class="muted">${E(b.event)} · ${M(b.rent)}</div></div>`).join(''):'<p class="muted">No bookings yet.</p>'}</div>`}
function newBooking(){ $('app').innerHTML=bar('New Booking')+`<div class="card"><div class="notice"><b>Create a booking first.</b><br>Customer Billing and Financial are separate and are opened after the booking is saved.</div><div class="grid"><div class="field"><label>Booking / Serial No.</label><input id="bid" placeholder="SS001"></div><div class="field"><label>Event Type</label><input id="event" placeholder="Marriage / Reception"></div><div class="field"><label>Customer Name</label><input id="customer"></div><div class="field"><label>Phone Number</label><input id="phone" inputmode="tel"></div><div class="field"><label>Booking Date</label><input id="bookingDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Event Date</label><input id="date" type="date"></div><div class="field"><label>Hall Rent</label><input id="rent" type="number" min="0"></div><div class="field"><label>1st Advance</label><input id="a1" type="number" min="0"></div><div class="field"><label>1st Advance Received Date</label><input id="a1Date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>1st Advance Payment Mode</label><select id="m1">${modes('Cash')}</select></div><div class="field"><label>2nd Advance</label><input id="a2" type="number" min="0"></div><div class="field"><label>2nd Advance Received Date</label><input id="a2Date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>2nd Advance Payment Mode</label><select id="m2">${modes('Cash')}</select></div></div><div class="field"><label>Notes / Remarks</label><textarea id="notes"></textarea></div><button class="primary" style="margin-top:12px" onclick="saveBooking()">💾 Save Booking</button></div>`}
function saveBooking(){let id=$('bid').value.trim(),customer=$('customer').value.trim();if(!id)return alert('Enter Booking / Serial No.');if(!customer)return alert('Enter Customer Name.');if(db.bookings.some(b=>b.id.toLowerCase()===id.toLowerCase()))return alert('Booking number already exists.');db.bookings.push({id,event:$('event').value.trim()||'Event',customer,phone:$('phone').value.trim(),date:$('date').value,bookingDate:$("bookingDate").value,rent:N($('rent').value),a1:N($('a1').value),a1Date:$('a1Date').value,m1:$('m1').value,a2:N($('a2').value),a2Date:$('a2Date').value,m2:$('m2').value,notes:$('notes').value.trim(),water:0,power:0,other:[],final:0,finalMode:'Cash',cleared:false,decoVendor:0,lightVendor:0,decoComm:0,lightComm:0,expenses:[]});save();openBooking(id)}
function bookings(){ $('app').innerHTML=bar('Bookings')+`<div class="card"><input id="bq" placeholder="Search booking / customer / mobile" oninput="renderBookings()"></div><div id="blist" class="list"></div>`;renderBookings()}function renderBookings(){let q=($('bq')?.value||'').toLowerCase(),a=db.bookings.filter(b=>(b.id+' '+b.customer+' '+b.phone).toLowerCase().includes(q));$('blist').innerHTML=a.length?a.slice().reverse().map(b=>`<div class="item"><div class="row"><div><h3 style="margin:0;color:var(--n)">${E(b.id)} — ${E(b.event)}</h3><div>${E(b.customer)} · ${E(b.phone)}</div><small class="muted">${E(b.date)} · Rent ${M(b.rent)}</small></div><button class="secondary" onclick="openBooking('${E(b.id)}')">Open</button></div><div class="shareGrid"><button class="secondary" onclick="confirmationPreview('${E(b.id)}')">💬 Share Confirmation</button><button class="secondary" onclick="confirmationPreview('${E(b.id)}')">🖼️ Confirmation Image</button></div></div>`).join(''):'<div class="card muted">No bookings found.</div>'}
function openBooking(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;$('app').innerHTML=bar(b.id)+`<div class="card"><h2 style="color:var(--n);margin-top:0">${E(b.customer)}</h2><p>${E(b.event)} · ${E(b.date)} · ${E(b.phone)}</p><div class="chips"><span class="chip">Hall Rent ${M(b.rent)}</span><span class="chip">1st Advance ${M(b.a1)} (${E(b.m1)})</span><span class="chip">2nd Advance ${M(b.a2)} (${E(b.m2)})</span></div><div class="shareGrid"><button class="primary" onclick="confirmationPreview('${E(id)}')">💬 Booking Confirmation</button><button class="secondary" onclick="billPreview('${E(id)}')">🖼️ Customer Bill</button><button class="secondary" onclick="billing('${E(id)}')">₹ Customer Billing</button><button class="secondary" onclick="finance('${E(id)}')">▤ Financial</button><button class="secondary" onclick="newBookingEdit('${E(id)}')">✏️ Edit Booking</button><button class="danger" onclick="deleteBooking('${E(id)}')">Delete</button></div></div>`}
function newBookingEdit(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;newBooking();$('bid').value=b.id;$('event').value=b.event;$('customer').value=b.customer;$('phone').value=b.phone;$('bookingDate').value=b.bookingDate||String(b.createdAt||'').slice(0,10)||new Date().toISOString().slice(0,10);$('date').value=b.date;$('rent').value=b.rent;$('a1').value=b.a1;$('a1Date').value=b.a1Date||b.bookingDate||String(b.createdAt||'').slice(0,10);$('m1').value=b.m1;$('a2').value=b.a2;$('a2Date').value=b.a2Date||b.bookingDate||String(b.createdAt||'').slice(0,10);$('m2').value=b.m2;$('notes').value=b.notes||'';document.querySelector('.homebar h2').textContent='Edit Booking';document.querySelector('.primary').onclick=()=>saveBookingEdit(id)}function saveBookingEdit(oldId){let b=db.bookings.find(x=>x.id===oldId);let id=$('bid').value.trim();if(!id||!$('customer').value.trim())return alert('Booking number and customer name are required.');if(id!==oldId&&db.bookings.some(x=>x.id.toLowerCase()===id.toLowerCase()))return alert('Booking number already exists.');Object.assign(b,{id,event:$('event').value.trim()||'Event',customer:$('customer').value.trim(),phone:$('phone').value.trim(),date:$('date').value,bookingDate:$('bookingDate').value,rent:N($('rent').value),a1:N($('a1').value),m1:$('m1').value,a2:N($('a2').value),m2:$('m2').value,notes:$('notes').value.trim()});save();openBooking(id)}function deleteBooking(id){if(!confirm('Delete this booking and all its billing/financial data?'))return;db.bookings=db.bookings.filter(b=>b.id!==id);save();bookings()}
function billing(id){$('app').innerHTML=bar('Customer Billing')+`<div class="card"><div class="notice"><b>CUSTOMER BILLING — CUSTOMER USE ONLY</b><br>Decoration and Lighting are not entered or shown here. This section creates the customer bill only.</div><label>Booking Number / Customer Name / Mobile</label><input id="billSearch" value="${E(id||'')}" placeholder="SS001"><button class="primary" style="margin-top:12px" onclick="findBilling()">✏️ Open Billing</button><div id="billMatches" class="list" style="margin-top:12px"></div></div>`;if(id)editBilling(id);else showBillMatches('')}
function showBillMatches(q){q=(q||'').toLowerCase();let a=db.bookings.filter(b=>(b.id+' '+b.customer+' '+b.phone).toLowerCase().includes(q));$('billMatches').innerHTML=a.length?a.map(b=>`<div class="item"><div class="row"><div><b>${E(b.id)} — ${E(b.customer)}</b><div class="muted">${E(b.phone)} · ${E(b.date)}</div></div><button class="secondary" onclick="editBilling('${E(b.id)}')">Open</button></div></div>`).join(''):'<p class="muted">No booking found.</p>'}function findBilling(){let q=$('billSearch').value.trim().toLowerCase(),b=db.bookings.find(x=>x.id.toLowerCase()===q);b?editBilling(b.id):showBillMatches(q)}
function billingDraft(id){let b=db.bookings.find(x=>x.id===id);if(!b)return null;return {...b,water:N($('bw')?.value),power:N($('bp')?.value),other:readOther(),final:N($('bf')?.value),finalMode:$('bfm')?.value||b.finalMode,cleared:$('bc')?.checked??b.cleared}}

function editBilling(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;$('app').innerHTML=bar('Customer Billing')+`<div class="card"><div class="notice"><b>${E(b.id)} — ${E(b.customer)}</b><br>Customer-facing bill only. Decoration and Lighting are excluded. Other Charges always remain on the customer bill; check “Finance Income” only when that charge should also be included in Financial.</div><div class="grid"><div class="field"><label>Water</label><input id="bw" type="number" value="${N(b.water)}" min="0"></div><div class="field"><label>Power Units</label><input id="bp" type="number" value="${N(b.power)}" min="0"></div></div><div class="title">Other Charges</div><div id="others">${(b.other||[]).map(x=>`<div class="otherRow" style="margin-bottom:10px"><div class="grid"><input class="on" value="${E(x.name)}" placeholder="Charge name"><input class="oa" type="number" value="${N(x.amount)}" placeholder="Amount"></div><label style="display:block;margin-top:6px"><input class="oi" type="checkbox" style="width:auto" ${x.financeIncome===true?'checked':''}> Finance Income</label></div>`).join('')}</div><button class="secondary" onclick="addOther()">＋ Add Other Charge</button><div class="title">Final Payment</div><div class="grid"><div class="field"><label>Final Payment Amount</label><input id="bf" type="number" value="${N(b.final)}" min="0"></div><div class="field"><label>Final Payment Mode</label><select id="bfm">${modes(b.finalMode)}</select></div></div><label><input id="bc" type="checkbox" style="width:auto" ${b.cleared?'checked':''}> Payment Cleared</label><div id="bpreview"></div><button class="primary" style="margin-top:12px" onclick="saveBilling('${E(id)}')">💾 Save Billing</button><div class="shareGrid"><button class="secondary" onclick="previewCurrentBilling('${E(id)}')">🖼️ Preview & Share Bill</button><button class="secondary" onclick="printBill('${E(id)}')">📄 Save / Print Bill</button></div></div>`;['bw','bp','bf'].forEach(k=>$(k).addEventListener('input',()=>previewBilling(b)));document.querySelectorAll('.on,.oa,.oi').forEach(e=>e.addEventListener('input',()=>previewBilling(b)));previewBilling(b)}
function addOther(){$('others').insertAdjacentHTML('beforeend','<div class="otherRow" style="margin-bottom:10px"><div class="grid"><input class="on" placeholder="Charge name"><input class="oa" type="number" placeholder="Amount"></div><label style="display:block;margin-top:6px"><input class="oi" type="checkbox" style="width:auto"> Finance Income</label></div>')}function readOther(){let ns=[...document.querySelectorAll('.on')],as=[...document.querySelectorAll('.oa')],is=[...document.querySelectorAll('.oi')];return ns.map((e,i)=>({name:e.value.trim(),amount:N(as[i]?.value),financeIncome:!!is[i]?.checked})).filter(x=>x.name||x.amount)}function previewBilling(b){let t={...b,water:N($('bw').value),power:N($('bp').value),other:readOther(),final:N($('bf').value)};$('bpreview').innerHTML=`<div class="card" style="background:#f8fbff"><table><tr><td>Customer Bill Total</td><td>${M(bill(t))}</td></tr><tr><td>Amount Received</td><td>${M(received(t))}</td></tr><tr class="total"><td>Balance Due</td><td>${M(Math.max(0,bill(t)-received(t)))}</td></tr></table></div>`}function saveBilling(id){let b=db.bookings.find(x=>x.id===id);b.water=N($('bw').value);b.power=N($('bp').value);b.other=readOther();b.final=N($('bf').value);b.finalMode=$('bfm').value;b.cleared=$('bc').checked;save();editBilling(id);alert('Customer billing saved.')}
function finance(id){$('app').innerHTML=bar('Financial')+`<div class="card"><div class="notice"><b>FINANCIAL — INTERNAL ACCOUNT PURPOSES ONLY</b><br>Customer Billing is separate. Decoration and Lighting vendor totals are entered here, with automatic @30% calculation. Expenses are also entered here.</div><label>Booking Number / Customer Name / Mobile</label><input id="finSearch" value="${E(id||'')}" placeholder="SS001"><button class="primary" style="margin-top:12px" onclick="findFinance()">✏️ Open Financial</button><div id="finMatches" class="list" style="margin-top:12px"></div></div>`;if(id)editFinance(id);else showFinance('')}
function showFinance(q){q=(q||'').toLowerCase();let a=db.bookings.filter(b=>(b.id+' '+b.customer+' '+b.phone).toLowerCase().includes(q));$('finMatches').innerHTML=a.length?a.map(b=>`<div class="item"><div class="row"><div><b>${E(b.id)} — ${E(b.customer)}</b><div class="muted">${E(b.phone)} · ${E(b.date)}</div></div><button class="secondary" onclick="editFinance('${E(b.id)}')">Open</button></div></div>`).join(''):'<p class="muted">No booking found.</p>'}function findFinance(){let q=$('finSearch').value.trim().toLowerCase(),b=db.bookings.find(x=>x.id.toLowerCase()===q);b?editFinance(b.id):showFinance(q)}
function editFinance(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;b.expenses=b.expenses||[];$('app').innerHTML=bar('Financial')+`<div class="card"><div class="notice"><b>${E(b.id)} — ${E(b.customer)}</b><br>Internal account. Final customer payment is not shown as a Financial line.</div><div class="grid"><div class="field"><label>Decoration Total (Vendor)</label><input id="fd" type="number" value="${N(b.decoVendor)}" min="0" oninput="calc30()"><small class="muted">Enter vendor total → @30% auto-calculates.</small></div><div class="field"><label>Decoration @30%</label><input id="fdc" type="number" value="${N(b.decoComm)}" min="0"></div><div class="field"><label>Lighting Total (Vendor)</label><input id="fl" type="number" value="${N(b.lightVendor)}" min="0" oninput="calc30()"><small class="muted">Enter vendor total → @30% auto-calculates.</small></div><div class="field"><label>Lighting @30%</label><input id="flc" type="number" value="${N(b.lightComm)}" min="0"></div><div class="field"><label>Water</label><input id="fw" type="number" value="${N(b.water)}" min="0"></div><div class="field"><label>Power Units</label><input id="fp" type="number" value="${N(b.power)}" min="0"></div></div><div class="title">Expenses</div><div class="notice">Enter every internal expense for this booking below. These expenses are deducted from Financial Balance and Cash Balance when applicable.</div><div id="expenses">${(b.expenses||[]).map(x=>`<div class="grid" style="margin-bottom:8px"><input class="en" value="${E(x.name)}" placeholder="Expense name"><input class="ea" type="number" value="${N(x.amount)}" placeholder="Amount"></div>`).join('')}</div><button class="secondary" onclick="addExpense()">＋ Add Expense</button><div id="fpreview"></div><button class="primary" style="margin-top:12px" onclick="saveFinance('${E(id)}')">💾 Save Financial</button><div class="shareGrid"><button class="secondary" style="width:100%;margin-top:10px" onclick="previewCurrentFinance('${E(id)}')">🖼️ Preview & Share Financial</button><button class="secondary" style="width:100%;margin-top:10px" onclick="printFinance('${E(id)}')">📄 Save / Print Financial</button></div></div>`;calc30();calcFinance(b)}
function calc30(){if($('fdc'))$('fdc').value=Math.round(N($('fd').value)*.30);if($('flc'))$('flc').value=Math.round(N($('fl').value)*.30);let id=$('expenses')?.closest('.card')?.querySelector('.notice b')?.textContent?.split(' — ')[0];let b=db.bookings.find(x=>x.id===id);if(b)calcFinance(b)}function addExpense(){$('expenses').insertAdjacentHTML('beforeend','<div class="grid" style="margin-bottom:8px"><input class="en" placeholder="Expense name"><input class="ea" type="number" placeholder="Amount"></div>')}function readExpenses(){return [...document.querySelectorAll('.en')].map((e,i)=>({name:e.value.trim(),amount:N(document.querySelectorAll('.ea')[i].value)})).filter(x=>x.name||x.amount)}function calcFinance(b){if(!$('fpreview'))return;let t=N(b.rent)+N($('fw')?.value)+N($('fp')?.value)*18+N($('fdc')?.value)+N($('flc')?.value)+financeOther(b),e=readExpenses().reduce((s,x)=>s+N(x.amount),0),nc=(b.m1!=='Cash'?N(b.a1):0)+(b.m2!=='Cash'?N(b.a2):0),bal=t-e-nc;$('fpreview').innerHTML=`<div class="card" style="background:#f8fbff"><table><tr><td>Financial Total</td><td>${M(t)}</td></tr><tr><td>Expenses</td><td>− ${M(e)}</td></tr><tr><td>UPI / Company Account Advances</td><td>− ${M(nc)}</td></tr><tr class="total"><td>Financial Balance</td><td>${M(bal)}</td></tr><tr><td>1st Advance Received</td><td>${M(b.a1)} (${E(b.m1)})</td></tr><tr><td>2nd Advance Received</td><td>${M(b.a2)} (${E(b.m2)})</td></tr></table></div>`}function saveFinance(id){let b=db.bookings.find(x=>x.id===id);b.decoVendor=N($('fd').value);b.decoComm=N($('fdc').value);b.lightVendor=N($('fl').value);b.lightComm=N($('flc').value);b.water=N($('fw').value);b.power=N($('fp').value);b.expenses=readExpenses();save();editFinance(id);alert('Financial saved.')}
function reportData(id){let b=db.bookings.find(x=>x.id===id);if(!b)return{total:0,expenses:0,balance:0};return financialCalc(b)}
function financialCalc(b){let total=N(b.rent)+N(b.water)+N(b.power)*18+N(b.decoComm)+N(b.lightComm)+financeOther(b),expenses=(b.expenses||[]).reduce((s,x)=>s+N(x.amount),0),nc=(b.m1!=='Cash'?N(b.a1):0)+(b.m2!=='Cash'?N(b.a2):0);return{total,expenses,balance:total-expenses-nc,nc}}
function cash(){
  db.cashLedger=Array.isArray(db.cashLedger)?db.cashLedger:[];
  const entries=db.cashLedger;
  let balance=0;
  const rows=entries.map((x,i)=>{const credit=N(x.credit),debit=N(x.debit);balance+=credit-debit;return {x,i,balance}});
  const creditTotal=entries.reduce((s,x)=>s+N(x.credit),0),debitTotal=entries.reduce((s,x)=>s+N(x.debit),0);
  const today=new Date().toISOString().slice(0,10),month=today.slice(0,7);
  $('app').innerHTML=bar('Cash Balance')+`<div class="card">
    <div class="notice"><b>Manual Cash Balance</b><br>This section is completely independent. Enter cash credits and cash expenses/debits manually. It is not connected to Bookings, Billing or Financial.</div>
    <div id="cashEntryForm">
      <div class="grid">
        <div class="field"><label>Date</label><input id="cashDate" type="date" value="${today}"></div>
        <div class="field"><label>ID <span class="muted">(Credit only)</span></label><input id="cashId" placeholder="SS001 / CASH001"></div>
        <div class="field"><label>Amount Credit</label><input id="cashCredit" type="number" min="0" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label>Expense Details</label><input id="cashDebitName" placeholder="Electrician / Rent / Other"></div>
        <div class="field"><label>Amount Debit</label><input id="cashDebit" type="number" min="0" inputmode="decimal" placeholder="0"></div>
      </div>
      <button id="cashSaveBtn" class="primary" style="margin-top:12px" onclick="addCashEntry()">＋ Add Cash Entry</button>
      <button id="cashCancelBtn" class="secondary" style="margin-top:12px;display:none" onclick="cancelCashEdit()">Cancel Edit</button>
    </div>
    <div class="card" style="background:#f8fbff;margin-top:16px"><table><tr><td>Total Credit</td><td>${M(creditTotal)}</td></tr><tr><td>Total Debit</td><td>− ${M(debitTotal)}</td></tr><tr class="total"><td>Current Cash Balance</td><td>${M(balance)}</td></tr></table></div>

    <div class="title" style="margin-top:22px">Cash Balance Report</div>
    <div class="card" style="margin-top:0;background:#f8fbff">
      <div class="grid">
        <div class="field"><label>From Date</label><input id="cashReportFrom" type="date" value="${month}-01"></div>
        <div class="field"><label>To Date</label><input id="cashReportTo" type="date" value="${today}"></div>
      </div>
      <button class="secondary" style="width:100%;margin-top:8px" onclick="cashReport()">📊 View Custom Report</button>
    </div>
    <div id="cashReportBox"></div>

    <div class="title" style="margin-top:22px">Transaction History</div>
    ${rows.length?`<div style="overflow:auto"><table><thead><tr><th style="text-align:left;padding:8px 0">Date</th><th style="text-align:left;padding:8px 0">ID / Details</th><th style="text-align:right;padding:8px 0">Credit</th><th style="text-align:right;padding:8px 0">Debit</th><th style="text-align:right;padding:8px 0">Balance</th><th></th></tr></thead><tbody>${rows.slice().reverse().map(r=>`<tr><td>${E(r.x.date||String(r.x.createdAt||'').slice(0,10)||'—')}</td><td>${r.x.credit?`<b>${E(r.x.id||'—')}</b>`:(r.x.debitName?`<span class="muted">${E(r.x.debitName)}</span>`:'—')}</td><td style="text-align:right">${r.x.credit?M(r.x.credit):'—'}</td><td style="text-align:right">${r.x.debit?M(r.x.debit):'—'}</td><td style="text-align:right;font-weight:800">${M(r.balance)}</td><td style="white-space:nowrap;text-align:right"><button class="secondary" onclick="editCashEntry(${r.i})">Edit</button> <button class="danger" onclick="deleteCashEntry(${r.i})">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No cash entries yet. Add your first credit or debit above.</p>'}
  </div>`
}
function cashReport(){
  const start=$('cashReportFrom')?.value||'',end=$('cashReportTo')?.value||'';
  if(!start||!end){alert('Please select both From Date and To Date.');return}
  if(start>end){alert('From Date cannot be after To Date.');return}
  const entries=(db.cashLedger||[]).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
  let opening=0;
  entries.forEach(x=>{const dt=String(x.date||String(x.createdAt||'').slice(0,10));if(dt<start)opening+=N(x.credit)-N(x.debit)});
  const selected=entries.filter(x=>{const dt=String(x.date||String(x.createdAt||'').slice(0,10));return dt>=start&&dt<=end});
  let running=opening;
  const credit=selected.reduce((s,x)=>s+N(x.credit),0),debit=selected.reduce((s,x)=>s+N(x.debit),0);
  const table=selected.map(x=>{running+=N(x.credit)-N(x.debit);return `<tr><td>${E(x.date||'—')}</td><td>${x.credit?`<b>${E(x.id||'—')}</b>`:E(x.debitName||'—')}</td><td style="text-align:right">${x.credit?M(x.credit):'—'}</td><td style="text-align:right">${x.debit?M(x.debit):'—'}</td><td style="text-align:right;font-weight:800">${M(running)}</td></tr>`}).join('');
  const closing=opening+credit-debit;
  $('cashReportBox').innerHTML=`<div class="card" id="cashReportPaper"><div class="row"><div><h3 style="margin:0;color:var(--n)">Custom Cash Balance Report</h3><div class="muted" style="margin-top:4px">${E(start)} to ${E(end)}</div></div><button class="secondary" onclick="printCashReport('${E(start)}','${E(end)}')">📄 Save / Print PDF</button></div><div class="card" style="background:#f8fbff"><table><tr><td>Opening Balance</td><td>${M(opening)}</td></tr><tr><td>Total Credit</td><td>${M(credit)}</td></tr><tr><td>Total Debit</td><td>− ${M(debit)}</td></tr><tr class="total"><td>Closing Balance</td><td>${M(closing)}</td></tr></table></div>${selected.length?`<div style="overflow:auto"><table><thead><tr><th style="text-align:left;padding:8px 0">Date</th><th style="text-align:left;padding:8px 0">ID / Details</th><th style="text-align:right;padding:8px 0">Credit</th><th style="text-align:right;padding:8px 0">Debit</th><th style="text-align:right;padding:8px 0">Balance</th></tr></thead><tbody>${table}</tbody></table></div>`:'<p class="muted">No cash transactions for this period.</p>'}</div>`;

function fmtNum(v){return Number(v||0).toLocaleString('en-IN')}
function _shareCanvasImage(c,filename,title){
  // Robust iPhone/PWA image sharing: create the image synchronously first,
  // keep it visible in-app, and only invoke Web Share from the user's tap.
  try{
    const dataUrl=c.toDataURL('image/png');
    const overlay=document.createElement('div');overlay.className='imageShareOverlay';
    overlay.innerHTML=`<div class="imageShareBox">
      <div class="imageShareTop"><b>${E(title)}</b><button class="secondary" id="closeImageShare">Close</button></div>
      <div class="imageShareScroll"><img id="generatedShareImage" src="${dataUrl}" alt="${E(title)}"></div>
      <div class="imageShareButtons">
        <button class="primary" id="nativeImageShare">📤 Share Image</button>
        <a class="secondary" id="saveGeneratedImage" href="${dataUrl}" download="${E(filename)}" style="display:flex;align-items:center;justify-content:center;text-decoration:none">💾 Save Image</a>
        <button class="secondary" id="printGeneratedImage">📄 Print / Save PDF</button>
      </div>
      <p class="muted imageShareHint">On iPhone, tap Share Image to open the share sheet. If sharing is unavailable, tap Save Image or press and hold the image.</p>
    </div>`;
    document.body.appendChild(overlay);
    const close=()=>overlay.remove();
    overlay.querySelector('#closeImageShare').onclick=close;
    overlay.querySelector('#printGeneratedImage').onclick=()=>{
      const w=window.open('','_blank');
      if(!w){
        // Popup-free fallback: open the image itself in the current tab.
        const a=document.createElement('a');a.href=dataUrl;a.target='_blank';a.rel='noopener';a.click();return;
      }
      w.document.write(`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>${E(title)}</title><style>html,body{margin:0;background:#fff}img{display:block;width:100%;height:auto}</style></head><body><img src="${dataUrl}"></body></html>`);
      w.document.close();setTimeout(()=>w.print(),400);
    };
    overlay.querySelector('#nativeImageShare').onclick=async()=>{
      try{
        // Convert the already-created PNG into a File only at tap time.
        const res=await fetch(dataUrl);const blob=await res.blob();
        const file=new File([blob],filename,{type:'image/png'});
        if(navigator.share){
          if(!navigator.canShare || navigator.canShare({files:[file]})){
            await navigator.share({files:[file],title});return;
          }
          // Some iOS versions reject canShare(files) but still accept the file.
          try{await navigator.share({files:[file],title});return}catch(e){}
        }
        // Final fallback: hand the image to the OS as a download/openable file.
        const a=document.createElement('a');a.href=dataUrl;a.download=filename;a.target='_blank';a.rel='noopener';a.click();
      }catch(err){
        if(err && err.name==='AbortError')return;
        const a=document.createElement('a');a.href=dataUrl;a.download=filename;a.target='_blank';a.rel='noopener';a.click();
      }
    };
  }catch(err){alert('Unable to create the image. Please try again.');}
}

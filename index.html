<script>
const KEY='SRI_SQUARE_ACCOUNTS_FRESH_2026';let db=load();
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.bookings)){x.cashLedger=Array.isArray(x.cashLedger)?x.cashLedger:[];return x}return{bookings:[],cashLedger:[]}}catch(e){return{bookings:[],cashLedger:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function $(id){return document.getElementById(id)}function E(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function N(v){return Number(v)||0}function M(v){return '₹'+Math.round(N(v)).toLocaleString('en-IN')}function modes(sel){return ['Cash','UPI','Company Account'].map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}function openMenu(){$('menu').classList.remove('hidden');applyMenuSettings()}function closeMenu(){$('menu').classList.add('hidden')}
const MENU_DEFAULTS=[['new-booking','＋ New Booking','openNewBooking(event,true)'],['bookings','📋 Bookings','bookings()'],['calendar','📅 Calendar / Availability','calendar()'],['customers','👥 Customers','customers()'],['billing','₹ Customer Billing','billing()'],['finance','▤ Financial','finance()'],['cash','💵 Cash Balance','cash()'],['backup','⬇ Backup Data','backup()'],['restore','⬆ Restore Data','restore()'],['gdrive','☁️ Google Drive Backup','googleDriveBackup()']];

function applyMenuSettings(){let cfg=getMenuSettings(),box=document.querySelector('#dynamicMenuItems');if(!box)return;box.innerHTML='';cfg.order.forEach(id=>{let item=MENU_DEFAULTS.find(x=>x[0]===id);if(!item||cfg.visible[id]===false)return;let b=document.createElement('button');b.className='menuItem dynamicMenuItem';b.innerHTML=item[1];b.setAttribute('onclick','closeMenu();'+item[2]);box.appendChild(b)})}
const HOME_DEFAULTS=[['new-booking','＋','New Booking','openNewBooking(event,false)'],['customers','👥','Customers','customers()'],['billing','🧾','Final Bill','billing()'],['finance','▤','Financial','finance()'],['calendar','📅','Calendar','calendar()'],['bookings','📊','Bookings','bookings()'],['cash','💵','Cash Balance','cash()'],['backup','⬇','Backup Data','backup()'],['restore','⬆','Restore Data','restore()'],['gdrive','☁️','Google Drive Backup','googleDriveBackup()']];

function saveHomeSettings(x){localStorage.setItem('SS_HOME_SETTINGS',JSON.stringify(x));home()}
function appSettings(){closeMenu();document.body.classList.remove('homeMode');let cfg=getHomeSettings();let rows=cfg.order.map((id)=>{let item=HOME_DEFAULTS.find(x=>x[0]===id);if(!item)return '';return `<div class="item" style="display:flex;align-items:center;gap:10px"><input type="checkbox" ${cfg.visible[id]!==false?'checked':''} onchange="toggleHomeItem('${id}',this.checked)" style="width:20px;height:20px"><span style="font-size:25px;width:34px;text-align:center">${item[1]}</span><b style="flex:1">${item[2]}</b><button class="secondary" onclick="moveHomeItem('${id}',-1)">↑</button><button class="secondary" onclick="moveHomeItem('${id}',1)">↓</button></div>`}).join('');$('app').innerHTML=bar('App Settings')+`<div class="card"><h3 style="color:var(--n);margin-top:0">Home Page / Dashboard</h3><p class="muted">Choose which Quick Actions appear on the main Home page and change their order. The slide-out Menu is not affected.</p><div class="list">${rows}</div><button class="primary" style="margin-top:15px" onclick="resetHomeSettings()">Reset Home Page</button></div>`}

function bill(b){return N(b.rent)+N(b.water)+N(b.power)*18+(b.other||[]).reduce((s,x)=>s+N(x.amount),0)}function isFinanceIncome(x){return x&&(x.financeIncome===true||x.financeIncome==='true'||x.financeIncome===1||x.financeIncome==='1'||x.finance===true||x.includeFinance===true||x.income===true)}
function financeOther(b){return (b.other||[]).filter(isFinanceIncome).reduce((s,x)=>s+N(x.amount),0)}function received(b){return N(b.a1)+N(b.a2)+(b.cleared?N(b.final):0)}function cashIn(b){let x=0;if(b.m1==='Cash')x+=N(b.a1);if(b.m2==='Cash')x+=N(b.a2);if(b.cleared&&b.finalMode==='Cash')x+=N(b.final);return x}

function home(){document.body.classList.add('homeMode');let bs=db.bookings,d=bs.reduce((s,b)=>s+Math.max(0,bill(b)-received(b)),0),entries=Array.isArray(db.cashLedger)?db.cashLedger:[],cashBalance=entries.reduce((s,x)=>s+N(x.credit)-N(x.debit),0),debitTotal=entries.reduce((s,x)=>s+N(x.debit),0);$('app').innerHTML=`<button type="button" class="homeCalendar" onclick="calendar()"><span class="homeCalIcon">📅</span><span class="homeCalText"><small>Today</small><b id="homeToday">—</b></span><span class="homeCalCta">View Calendar&nbsp; →</span></button><section class="hero"><div class="heroMain"><small>SRI SQUARE</small><h2>Business Overview</h2><p>Bookings · Customer Billing · Cash · Financial Reports</p></div><div class="heroTag">MANAGE<br>TODAY<br><span>GROW</span><br><span>TOMORROW</span><i></i></div></section><div class="stats"><div class="stat"><label>📅 Total Bookings</label><b>${bs.length}</b><small>All bookings</small></div><div class="stat"><label>👥 Balance Due</label><b>${M(d)}</b><small>Customer pending</small></div><div class="stat"><label>💵 Cash Balance</label><b>${M(cashBalance)}</b><small>Manual cash ledger</small></div><div class="stat"><label>🧾 Total Debits</label><b>${M(debitTotal)}</b><small>Cash expenses</small></div></div><div class="title">Quick Actions</div><div class="actions" id="homeActions"></div><div class="card homeRecent"><div class="title" style="margin-top:0">Upcoming Bookings</div>${bs.length?bs.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).slice(0,5).map(b=>`<div class="item" style="margin-bottom:9px" onclick="openBooking('${E(b.id)}')"><div class="row"><b>${E(b.id)} — ${E(b.customer)}</b><b>${E(b.date)}</b></div><div class="muted">${E(b.event)} · ${M(b.rent)}</div></div>`).join(''):'<p class="muted">No bookings yet.</p>'}</div>`;const ha=$("homeActions");if(ha){let hc=getHomeSettings();ha.innerHTML=hc.order.map(id=>{let item=HOME_DEFAULTS.find(x=>x[0]===id);if(!item||hc.visible[id]===false)return '';return `<button type="button" class="action" onclick="${item[3]}"><div class="ico">${item[1]}</div>${item[2]}</button>`}).join('')}const el=$("homeToday");if(el){const now=new Date();el.textContent=now.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}}

function calendar(monthOffset=0){
  let base=new Date();
  if(window.__calDate){base=new Date(window.__calDate.getFullYear(),window.__calDate.getMonth(),1)}else base=new Date(base.getFullYear(),base.getMonth(),1);
  base.setMonth(base.getMonth()+N(monthOffset)); window.__calDate=base;
  const y=base.getFullYear(),m=base.getMonth(),monthName=base.toLocaleString('en-IN',{month:'long',year:'numeric'});
  const first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const today=new Date(); const todayKey=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const byDate={};
  db.bookings.forEach(b=>{if(!b.date)return;(byDate[b.date]??=[]).push(b)});
  let cells='';
  for(let i=0;i<42;i++){
    let day=i-start+1, yy=y, mm=m, muted=false;
    if(day<1){day=prevDays+day;mm=m-1;muted=true}else if(day>days){day=day-days;mm=m+1;muted=true}
    const key=`${yyFor(mm,yy)}-${String(mm+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const list=byDate[key]||[]; const booked=list.length>0;
    const isToday=key===todayKey;
    cells+=`<button class="calDay ${muted?'mutedDay ':''}${booked?'booked ':''}${isToday?'today':''}" onclick="showCalendarDay('${key}')"><span class="num">${day}</span>${booked?`<span class="count"><span class="dot"></span>${list.length} booking${list.length>1?'s':''}</span>`:''}</button>`;
  }
  $('app').innerHTML=bar('Calendar / Availability')+`<div class="card"><div class="calendarHead"><h3>${monthName}</h3><div class="calNav"><button onclick="calendar(-1)">‹</button><button onclick="goToday()">Today</button><button onclick="calendar(1)">›</button></div></div><div class="calendarGrid"><div class="calDow">Sun</div><div class="calDow">Mon</div><div class="calDow">Tue</div><div class="calDow">Wed</div><div class="calDow">Thu</div><div class="calDow">Fri</div><div class="calDow">Sat</div>${cells}</div><div class="availabilityLegend"><span>🔵 Booked date</span><span>⬜ No booking</span><span>Tap any date to view bookings</span></div><div id="calDayBookings" class="dayBookings"><div class="availableBox">Select a date to check availability.</div></div></div>`;
}
function yyFor(mm,yy){return mm<0?yy-1:mm>11?yy+1:yy}
function goToday(){window.__calDate=new Date();calendar(0)}
function showCalendarDay(key){
  const list=db.bookings.filter(b=>b.date===key); const box=$('calDayBookings'); if(!box)return;
  if(!list.length){box.innerHTML=`<div class="availableBox">✅ Available — no booking on <b>${E(key)}</b>.</div>`;return}
  box.innerHTML=`<h3>Bookings on ${E(key)}</h3><div class="list">${list.map(b=>`<div class="item"><div class="row"><div><b style="color:var(--n)">${E(b.id)} — ${E(b.customer)}</b><div class="muted">${E(b.event)} · Hall Rent ${M(b.rent)}</div></div><button class="secondary" onclick="openBooking('${E(b.id)}')">Open</button></div></div>`).join('')}</div>`;
}

function newBooking(){ $('app').innerHTML=bar('New Booking')+`<div class="card"><div class="notice"><b>Create a booking first.</b><br>Customer Billing and Financial are separate and are opened after the booking is saved.</div><div class="grid"><div class="field"><label>Booking / Serial No.</label><input id="bid" placeholder="SS001"></div><div class="field"><label>Event Type</label><input id="event" placeholder="Marriage / Reception"></div><div class="field"><label>Customer Name</label><input id="customer"></div><div class="field"><label>Phone Number</label><input id="phone" inputmode="tel"></div><div class="field"><label>Booking Date</label><input id="bookingDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Event Date</label><input id="date" type="date"></div><div class="field"><label>Hall Rent</label><input id="rent" type="number" min="0"></div><div class="field"><label>1st Advance</label><input id="a1" type="number" min="0"></div><div class="field"><label>1st Advance Received Date</label><input id="a1Date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>1st Advance Payment Mode</label><select id="m1">${modes('Cash')}</select></div><div class="field"><label>2nd Advance</label><input id="a2" type="number" min="0"></div><div class="field"><label>2nd Advance Received Date</label><input id="a2Date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>2nd Advance Payment Mode</label><select id="m2">${modes('Cash')}</select></div></div><div class="field"><label>Notes / Remarks</label><textarea id="notes"></textarea></div><button class="primary" style="margin-top:12px" onclick="saveBooking()">💾 Save Booking</button></div>`}
function saveBooking(){let id=$('bid').value.trim(),customer=$('customer').value.trim();if(!id)return alert('Enter Booking / Serial No.');if(!customer)return alert('Enter Customer Name.');if(db.bookings.some(b=>b.id.toLowerCase()===id.toLowerCase()))return alert('Booking number already exists.');db.bookings.push({id,event:$('event').value.trim()||'Event',customer,phone:$('phone').value.trim(),date:$('date').value,bookingDate:$("bookingDate").value,rent:N($('rent').value),a1:N($('a1').value),a1Date:$('a1Date').value,m1:$('m1').value,a2:N($('a2').value),a2Date:$('a2Date').value,m2:$('m2').value,notes:$('notes').value.trim(),water:0,power:0,other:[],final:0,finalMode:'Cash',cleared:false,decoVendor:0,lightVendor:0,decoComm:0,lightComm:0,expenses:[]});save();openBooking(id)}
function bookings(){ $('app').innerHTML=bar('Bookings')+`<div class="card"><input id="bq" placeholder="Search booking / customer / mobile" oninput="renderBookings()"></div><div id="blist" class="list"></div>`;renderBookings()}function renderBookings(){let q=($('bq')?.value||'').toLowerCase(),a=db.bookings.filter(b=>(b.id+' '+b.customer+' '+b.phone).toLowerCase().includes(q));$('blist').innerHTML=a.length?a.slice().reverse().map(b=>`<div class="item"><div class="row"><div><h3 style="margin:0;color:var(--n)">${E(b.id)} — ${E(b.event)}</h3><div>${E(b.customer)} · ${E(b.phone)}</div><small class="muted">${E(b.date)} · Rent ${M(b.rent)}</small></div><button class="secondary" onclick="openBooking('${E(b.id)}')">Open</button></div><div class="shareGrid"><button class="secondary" onclick="confirmationPreview('${E(b.id)}')">💬 Share Confirmation</button><button class="secondary" onclick="confirmationPreview('${E(b.id)}')">🖼️ Confirmation Image</button></div></div>`).join(''):'<div class="card muted">No bookings found.</div>'}
function openBooking(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;$('app').innerHTML=bar(b.id)+`<div class="card"><h2 style="color:var(--n);margin-top:0">${E(b.customer)}</h2><p>${E(b.event)} · ${E(b.date)} · ${E(b.phone)}</p><div class="chips"><span class="chip">Hall Rent ${M(b.rent)}</span><span class="chip">1st Advance ${M(b.a1)} (${E(b.m1)})</span><span class="chip">2nd Advance ${M(b.a2)} (${E(b.m2)})</span></div><div class="shareGrid"><button class="primary" onclick="confirmationPreview('${E(id)}')">💬 Booking Confirmation</button><button class="secondary" onclick="billPreview('${E(id)}')">🖼️ Customer Bill</button><button class="secondary" onclick="billing('${E(id)}')">₹ Customer Billing</button><button class="secondary" onclick="finance('${E(id)}')">▤ Financial</button><button class="secondary" onclick="newBookingEdit('${E(id)}')">✏️ Edit Booking</button><button class="danger" onclick="deleteBooking('${E(id)}')">Delete</button></div></div>`}
function newBookingEdit(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;newBooking();$('bid').value=b.id;$('event').value=b.event;$('customer').value=b.customer;$('phone').value=b.phone;$('bookingDate').value=b.bookingDate||String(b.createdAt||'').slice(0,10)||new Date().toISOString().slice(0,10);$('date').value=b.date;$('rent').value=b.rent;$('a1').value=b.a1;$('a1Date').value=b.a1Date||b.bookingDate||String(b.createdAt||'').slice(0,10);$('m1').value=b.m1;$('a2').value=b.a2;$('a2Date').value=b.a2Date||b.bookingDate||String(b.createdAt||'').slice(0,10);$('m2').value=b.m2;$('notes').value=b.notes||'';document.querySelector('.homebar h2').textContent='Edit Booking';document.querySelector('.primary').onclick=()=>saveBookingEdit(id)}function saveBookingEdit(oldId){let b=db.bookings.find(x=>x.id===oldId);let id=$('bid').value.trim();if(!id||!$('customer').value.trim())return alert('Booking number and customer name are required.');if(id!==oldId&&db.bookings.some(x=>x.id.toLowerCase()===id.toLowerCase()))return alert('Booking number already exists.');Object.assign(b,{id,event:$('event').value.trim()||'Event',customer:$('customer').value.trim(),phone:$('phone').value.trim(),date:$('date').value,bookingDate:$('bookingDate').value,rent:N($('rent').value),a1:N($('a1').value),m1:$('m1').value,a2:N($('a2').value),m2:$('m2').value,notes:$('notes').value.trim()});save();openBooking(id)}function deleteBooking(id){if(!confirm('Delete this booking and all its billing/financial data?'))return;db.bookings=db.bookings.filter(b=>b.id!==id);save();bookings()}
function billing(id){$('app').innerHTML=bar('Customer Billing')+`<div class="card"><div class="notice"><b>CUSTOMER BILLING — CUSTOMER USE ONLY</b><br>Decoration and Lighting are not entered or shown here. This section creates the customer bill only.</div><label>Booking Number / Customer Name / Mobile</label><input id="billSearch" value="${E(id||'')}" placeholder="SS001"><button class="primary" style="margin-top:12px" onclick="findBilling()">✏️ Open Billing</button><div id="billMatches" class="list" style="margin-top:12px"></div></div>`;if(id)editBilling(id);else showBillMatches('')}
function showBillMatches(q){q=(q||'').toLowerCase();let a=db.bookings.filter(b=>(b.id+' '+b.customer+' '+b.phone).toLowerCase().includes(q));$('billMatches').innerHTML=a.length?a.map(b=>`<div class="item"><div class="row"><div><b>${E(b.id)} — ${E(b.customer)}</b><div class="muted">${E(b.phone)} · ${E(b.date)}</div></div><button class="secondary" onclick="editBilling('${E(b.id)}')">Open</button></div></div>`).join(''):'<p class="muted">No booking found.</p>'}function findBilling(){let q=$('billSearch').value.trim().toLowerCase(),b=db.bookings.find(x=>x.id.toLowerCase()===q);b?editBilling(b.id):showBillMatches(q)}
function billingDraft(id){let b=db.bookings.find(x=>x.id===id);if(!b)return null;return {...b,water:N($('bw')?.value),power:N($('bp')?.value),other:readOther(),final:N($('bf')?.value),finalMode:$('bfm')?.value||b.finalMode,cleared:$('bc')?.checked??b.cleared}}

function editBilling(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;$('app').innerHTML=bar('Customer Billing')+`<div class="card"><div class="notice"><b>${E(b.id)} — ${E(b.customer)}</b><br>Customer-facing bill only. Decoration and Lighting are excluded. Other Charges always remain on the customer bill; check “Finance Income” only when that charge should also be included in Financial.</div><div class="grid"><div class="field"><label>Water</label><input id="bw" type="number" value="${N(b.water)}" min="0"></div><div class="field"><label>Power Units</label><input id="bp" type="number" value="${N(b.power)}" min="0"></div></div><div class="title">Other Charges</div><div id="others">${(b.other||[]).map(x=>`<div class="otherRow" style="margin-bottom:10px"><div class="grid"><input class="on" value="${E(x.name)}" placeholder="Charge name"><input class="oa" type="number" value="${N(x.amount)}" placeholder="Amount"></div><label style="display:block;margin-top:6px"><input class="oi" type="checkbox" style="width:auto" ${x.financeIncome===true?'checked':''}> Finance Income</label></div>`).join('')}</div><button class="secondary" onclick="addOther()">＋ Add Other Charge</button><div class="title">Final Payment</div><div class="grid"><div class="field"><label>Final Payment Amount</label><input id="bf" type="number" value="${N(b.final)}" min="0"></div><div class="field"><label>Final Payment Mode</label><select id="bfm">${modes(b.finalMode)}</select></div></div><label><input id="bc" type="checkbox" style="width:auto" ${b.cleared?'checked':''}> Payment Cleared</label><div id="bpreview"></div><button class="primary" style="margin-top:12px" onclick="saveBilling('${E(id)}')">💾 Save Billing</button><div class="shareGrid"><button class="secondary" onclick="previewCurrentBilling('${E(id)}')">🖼️ Preview & Share Bill</button><button class="secondary" onclick="printBill('${E(id)}')">📄 Save / Print Bill</button></div></div>`;['bw','bp','bf'].forEach(k=>$(k).addEventListener('input',()=>previewBilling(b)));document.querySelectorAll('.on,.oa,.oi').forEach(e=>e.addEventListener('input',()=>previewBilling(b)));previewBilling(b)}
function addOther(){$('others').insertAdjacentHTML('beforeend','<div class="otherRow" style="margin-bottom:10px"><div class="grid"><input class="on" placeholder="Charge name"><input class="oa" type="number" placeholder="Amount"></div><label style="display:block;margin-top:6px"><input class="oi" type="checkbox" style="width:auto"> Finance Income</label></div>')}function readOther(){let ns=[...document.querySelectorAll('.on')],as=[...document.querySelectorAll('.oa')],is=[...document.querySelectorAll('.oi')];return ns.map((e,i)=>({name:e.value.trim(),amount:N(as[i]?.value),financeIncome:!!is[i]?.checked})).filter(x=>x.name||x.amount)}function previewBilling(b){let t={...b,water:N($('bw').value),power:N($('bp').value),other:readOther(),final:N($('bf').value)};$('bpreview').innerHTML=`<div class="card" style="background:#f8fbff"><table><tr><td>Customer Bill Total</td><td>${M(bill(t))}</td></tr><tr><td>Amount Received</td><td>${M(received(t))}</td></tr><tr class="total"><td>Balance Due</td><td>${M(Math.max(0,bill(t)-received(t)))}</td></tr></table></div>`}function saveBilling(id){let b=db.bookings.find(x=>x.id===id);b.water=N($('bw').value);b.power=N($('bp').value);b.other=readOther();b.final=N($('bf').value);b.finalMode=$('bfm').value;b.cleared=$('bc').checked;save();editBilling(id);alert('Customer billing saved.')}
function finance(id){$('app').innerHTML=bar('Financial')+`<div class="card"><div class="notice"><b>FINANCIAL — INTERNAL ACCOUNT PURPOSES ONLY</b><br>Customer Billing is separate. Decoration and Lighting vendor totals are entered here, with automatic @30% calculation. Expenses are also entered here.</div><label>Booking Number / Customer Name / Mobile</label><input id="finSearch" value="${E(id||'')}" placeholder="SS001"><button class="primary" style="margin-top:12px" onclick="findFinance()">✏️ Open Financial</button><div id="finMatches" class="list" style="margin-top:12px"></div></div>`;if(id)editFinance(id);else showFinance('')}
function showFinance(q){q=(q||'').toLowerCase();let a=db.bookings.filter(b=>(b.id+' '+b.customer+' '+b.phone).toLowerCase().includes(q));$('finMatches').innerHTML=a.length?a.map(b=>`<div class="item"><div class="row"><div><b>${E(b.id)} — ${E(b.customer)}</b><div class="muted">${E(b.phone)} · ${E(b.date)}</div></div><button class="secondary" onclick="editFinance('${E(b.id)}')">Open</button></div></div>`).join(''):'<p class="muted">No booking found.</p>'}function findFinance(){let q=$('finSearch').value.trim().toLowerCase(),b=db.bookings.find(x=>x.id.toLowerCase()===q);b?editFinance(b.id):showFinance(q)}
function editFinance(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;b.expenses=b.expenses||[];$('app').innerHTML=bar('Financial')+`<div class="card"><div class="notice"><b>${E(b.id)} — ${E(b.customer)}</b><br>Internal account. Final customer payment is not shown as a Financial line.</div><div class="grid"><div class="field"><label>Decoration Total (Vendor)</label><input id="fd" type="number" value="${N(b.decoVendor)}" min="0" oninput="calc30()"><small class="muted">Enter vendor total → @30% auto-calculates.</small></div><div class="field"><label>Decoration @30%</label><input id="fdc" type="number" value="${N(b.decoComm)}" min="0"></div><div class="field"><label>Lighting Total (Vendor)</label><input id="fl" type="number" value="${N(b.lightVendor)}" min="0" oninput="calc30()"><small class="muted">Enter vendor total → @30% auto-calculates.</small></div><div class="field"><label>Lighting @30%</label><input id="flc" type="number" value="${N(b.lightComm)}" min="0"></div><div class="field"><label>Water</label><input id="fw" type="number" value="${N(b.water)}" min="0"></div><div class="field"><label>Power Units</label><input id="fp" type="number" value="${N(b.power)}" min="0"></div></div><div class="title">Expenses</div><div class="notice">Enter every internal expense for this booking below. These expenses are deducted from Event Balance and Cash Balance when applicable.</div><div id="expenses">${(b.expenses||[]).map(x=>`<div class="grid" style="margin-bottom:8px"><input class="en" value="${E(x.name)}" placeholder="Expense name"><input class="ea" type="number" value="${N(x.amount)}" placeholder="Amount"></div>`).join('')}</div><button class="secondary" onclick="addExpense()">＋ Add Expense</button><div id="fpreview"></div><button class="primary" style="margin-top:12px" onclick="saveFinance('${E(id)}')">💾 Save Financial</button><div class="shareGrid"><button class="secondary" style="width:100%;margin-top:10px" onclick="previewCurrentFinance('${E(id)}')">🖼️ Preview & Share Financial</button><button class="secondary" style="width:100%;margin-top:10px" onclick="printFinance('${E(id)}')">📄 Save / Print Financial</button></div></div>`;calc30();calcFinance(b)}
function calc30(){if($('fdc'))$('fdc').value=Math.round(N($('fd').value)*.30);if($('flc'))$('flc').value=Math.round(N($('fl').value)*.30);let id=$('expenses')?.closest('.card')?.querySelector('.notice b')?.textContent?.split(' — ')[0];let b=db.bookings.find(x=>x.id===id);if(b)calcFinance(b)}function addExpense(){$('expenses').insertAdjacentHTML('beforeend','<div class="grid" style="margin-bottom:8px"><input class="en" placeholder="Expense name"><input class="ea" type="number" placeholder="Amount"></div>')}function readExpenses(){return [...document.querySelectorAll('.en')].map((e,i)=>({name:e.value.trim(),amount:N(document.querySelectorAll('.ea')[i].value)})).filter(x=>x.name||x.amount)}function calcFinance(b){if(!$('fpreview'))return;let t=N(b.rent)+N($('fw')?.value)+N($('fp')?.value)*18+N($('fdc')?.value)+N($('flc')?.value)+financeOther(b),e=readExpenses().reduce((s,x)=>s+N(x.amount),0),nc=(b.m1!=='Cash'?N(b.a1):0)+(b.m2!=='Cash'?N(b.a2):0),bal=t-e-nc;$('fpreview').innerHTML=`<div class="card" style="background:#f8fbff"><table><tr><td>Financial Total</td><td>${M(t)}</td></tr><tr><td>Expenses</td><td>− ${M(e)}</td></tr><tr><td>UPI / Company Account Advances</td><td>− ${M(nc)}</td></tr><tr class="total"><td>Event Balance</td><td>${M(bal)}</td></tr><tr><td>1st Advance Received</td><td>${M(b.a1)} (${E(b.m1)})</td></tr><tr><td>2nd Advance Received</td><td>${M(b.a2)} (${E(b.m2)})</td></tr></table></div>`}function saveFinance(id){let b=db.bookings.find(x=>x.id===id);b.decoVendor=N($('fd').value);b.decoComm=N($('fdc').value);b.lightVendor=N($('fl').value);b.lightComm=N($('flc').value);b.water=N($('fw').value);b.power=N($('fp').value);b.expenses=readExpenses();save();editFinance(id);alert('Financial saved.')}
function reportData(id){let b=db.bookings.find(x=>x.id===id);if(!b)return{total:0,expenses:0,balance:0};return financialCalc(b)}
function financialCalc(b){let total=N(b.rent)+N(b.water)+N(b.power)*18+N(b.decoComm)+N(b.lightComm)+financeOther(b),expenses=(b.expenses||[]).reduce((s,x)=>s+N(x.amount),0),nc=(b.m1!=='Cash'?N(b.a1):0)+(b.m2!=='Cash'?N(b.a2):0);return{total,expenses,balance:total-expenses-nc,nc}}

function cashReport(){
  const start=$('cashReportFrom')?.value||'',end=$('cashReportTo')?.value||'';

  if(start>end){alert('From Date cannot be after To Date.');return}

  let opening=0;
  entries.forEach(x=>{const dt=String(x.date||String(x.createdAt||'').slice(0,10));if(dt<start)opening+=N(x.credit)-N(x.debit)});
  const selected=entries.filter(x=>{const dt=String(x.date||String(x.createdAt||'').slice(0,10));return dt>=start&&dt<=end});
  let running=opening;
  const credit=selected.reduce((s,x)=>s+N(x.credit),0),debit=selected.reduce((s,x)=>s+N(x.debit),0);
  const table=selected.map(x=>{running+=N(x.credit)-N(x.debit);return `<tr><td>${E(x.date||'—')}</td><td>${x.credit?`<b>${E(x.id||'—')}</b>`:E(x.debitName||'—')}</td><td style="text-align:right">${x.credit?M(x.credit):'—'}</td><td style="text-align:right">${x.debit?M(x.debit):'—'}</td><td style="text-align:right;font-weight:800">${M(running)}</td></tr>`}).join('');
  const closing=opening+credit-debit;
  $('cashReportBox').innerHTML=`<div class="card" id="cashReportPaper"><div class="row"><div><h3 style="margin:0;color:var(--n)">Custom Cash Balance Report</h3><div class="muted" style="margin-top:4px">${E(start)} to ${E(end)}</div></div><button class="secondary" onclick="printCashReport('${E(start)}','${E(end)}')">📄 Save / Print PDF</button></div><div class="card" style="background:#f8fbff"><table><tr><td>Opening Balance</td><td>${M(opening)}</td></tr><tr><td>Total Credit</td><td>${M(credit)}</td></tr><tr><td>Total Debit</td><td>− ${M(debit)}</td></tr><tr class="total"><td>Closing Balance</td><td>${M(closing)}</td></tr></table></div>${selected.length?`<div style="overflow:auto"><table><thead><tr><th style="text-align:left;padding:8px 0">Date</th><th style="text-align:left;padding:8px 0">ID / Details</th><th style="text-align:right;padding:8px 0">Credit</th><th style="text-align:right;padding:8px 0">Debit</th><th style="text-align:right;padding:8px 0">Balance</th></tr></thead><tbody>${table}</tbody></table></div>`:'<p class="muted">No cash transactions for this period.</p>'}</div>`;
}

h>Debit</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table>`:'<p>No cash transactions for this period.</p>'}</main><script>window.onload=()=>window.print()<\/script>
</body></html>`);w.document.close()

function addCashEntry(){
  const date=$('cashDate').value||new Date().toISOString().slice(0,10),id=$('cashId').value.trim(),credit=N($('cashCredit').value),debitName=$('cashDebitName').value.trim(),debit=N($('cashDebit').value);
  if(credit<=0&&debit<=0){alert('Enter a Credit amount or Debit amount.');return}
  if(credit>0&&debit>0){alert('Enter either Credit or Debit for one entry.');return}
  if(credit>0&&!id){alert('Please enter an ID for the credit entry.');return}
  if(debit>0&&!debitName){alert('Please enter Expense Details for the debit.');return}
  const item={date,id:credit>0?id:'',credit,debitName:credit>0?'':debitName,debit,createdAt:new Date().toISOString()};
  if(Number.isInteger(window.cashEditIndex)){db.cashLedger[window.cashEditIndex]=item;window.cashEditIndex=null;save();cash();return}
  db.cashLedger.push(item);save();cash();
}
function editCashEntry(i){
  const x=db.cashLedger[i];if(!x)return;
  window.cashEditIndex=i;
  $('cashDate').value=x.date||String(x.createdAt||'').slice(0,10);
  $('cashId').value=x.id||'';
  $('cashCredit').value=x.credit||'';
  $('cashDebitName').value=x.debitName||'';
  $('cashDebit').value=x.debit||'';
  $('cashSaveBtn').textContent='💾 Update Cash Entry';
  $('cashCancelBtn').style.display='inline-block';

}
function cancelCashEdit(){window.cashEditIndex=null;cash()}
function deleteCashEntry(i){if(!confirm('Delete this cash entry? This cannot be undone.'))return;db.cashLedger.splice(i,1);save();cash()}
function customers(){$('app').innerHTML=bar('Customers')+`<div class="card"><input id="cq" placeholder="Search name / mobile / booking" oninput="renderCustomers()"><div class="shareGrid" style="margin-top:12px"><button class="secondary" onclick="exportCustomerData()">⬇️ Export Customer Data</button><button class="secondary" onclick="exportCustomerNumbers()">📱 Export Unique Numbers</button></div><small class="muted" style="display:block;margin-top:8px">Exports one row per customer; repeated bookings with the same mobile number are grouped together.</small></div><div id="cus" class="list"></div>`;renderCustomers()}
function customerGroups(){
  const groups=new Map();
  db.bookings.forEach(b=>{
    const phone=String(b.phone||'').replace(/\D/g,'');
    const name=String(b.customer||'').trim();
    const key=phone||name.toLowerCase()||b.id;
    if(!groups.has(key)) groups.set(key,{customer:name||'—',phone:b.phone||'',bookings:[]});
    const g=groups.get(key);
    g.bookings.push(b);
    if(!g.phone&&b.phone) g.phone=b.phone;
    if((g.customer==='—'||!g.customer)&&name) g.customer=name;
  });
  return [...groups.values()].sort((a,b)=>String(a.customer).localeCompare(String(b.customer)));
}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function downloadTextFile(text,filename,type){const blob=new Blob([text],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportCustomerData(){
  const rows=[['Customer Name','Mobile Number','Booking IDs','Booking Count']];
  customerGroups().forEach(g=>{
    const ids=g.bookings.slice().sort((x,y)=>String(x.id).localeCompare(String(y.id),undefined,{numeric:true})).map(b=>b.id).join(', ');
    rows.push([g.customer,g.phone,ids,g.bookings.length]);
  });
  if(rows.length===1)return alert('No customer data to export.');
  const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  downloadTextFile(csv,'Sri_Square_Customer_Data.csv','text/csv;charset=utf-8');
}
function exportCustomerNumbers(){
  const groups=customerGroups().filter(g=>String(g.phone||'').replace(/\D/g,'').length>=10);
  if(!groups.length)return alert('No customer mobile numbers to export.');
  const rows=[['Customer Name','Mobile Number']];
  groups.forEach(g=>rows.push([g.customer,g.phone]));
  const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  downloadTextFile(csv,'Sri_Square_Unique_Customer_Numbers.csv','text/csv;charset=utf-8');
}
function renderCustomers(){
  let q=($('cq')?.value||'').toLowerCase().trim();
  const groups=new Map();
  db.bookings.forEach(b=>{
    const phone=String(b.phone||'').replace(/\D/g,'');
    const name=String(b.customer||'').trim().toLowerCase();
    const key=phone||name||b.id;
    if(!groups.has(key)) groups.set(key,{customer:b.customer||'—',phone:b.phone||'',bookings:[]});
    const g=groups.get(key); g.bookings.push(b);
    if(!g.phone&&b.phone) g.phone=b.phone;
    if((g.customer==='—'||!g.customer)&&b.customer) g.customer=b.customer;
  });
  let a=[...groups.values()].filter(g=>{
    const hay=(g.customer+' '+g.phone+' '+g.bookings.map(b=>b.id+' '+(b.event||'')+' '+(b.date||'')).join(' ')).toLowerCase();
    return !q||hay.includes(q);
  });
  a.sort((x,y)=>String(x.customer).localeCompare(String(y.customer)));
  $('cus').innerHTML=a.length?a.map(g=>{
    const ids=g.bookings.slice().sort((x,y)=>String(x.id).localeCompare(String(y.id),undefined,{numeric:true})).map(b=>`<button class="chip" style="border:0;cursor:pointer" onclick="openBooking('${E(b.id)}')">${E(b.id)}</button>`).join('');
    return `<div class="item"><b>${E(g.customer)}</b><div>${E(g.phone||'—')}</div><div class="muted" style="margin-top:8px;font-weight:750">${g.bookings.length} booking${g.bookings.length===1?'':'s'}</div><div class="chips">${ids}</div><div class="shareGrid"><button class="secondary" onclick="location.href='tel:${E(g.phone)}'">📞 Call</button><button class="secondary" onclick="location.href='https://wa.me/91${E(g.phone)}'">💬 WhatsApp</button></div></div>`;
  }).join(''):'<p class="muted">No customers.</p>';
}

function makeBackupBlob(){let p={format:'SRI SQUARE ACCOUNTS BACKUP',version:'fresh-2026',createdAt:new Date().toISOString(),data:db};return new Blob([JSON.stringify(p,null,2)],{type:'application/json'})}
const GDRIVE_KEY='SRI_SQUARE_GOOGLE_DRIVE_V1';
let gdriveCfg=(()=>{try{return JSON.parse(localStorage.getItem(GDRIVE_KEY))||{clientId:'',token:'',tokenExpiry:0}}catch(e){return{clientId:'',token:'',tokenExpiry:0}}})();
function saveGDriveCfg(){localStorage.setItem(GDRIVE_KEY,JSON.stringify(gdriveCfg))}
function gdriveClientId(){return (gdriveCfg.clientId||'').trim()}
function gdriveHasToken(){return !!gdriveCfg.token && Date.now()<Number(gdriveCfg.tokenExpiry||0)-60000}
function gdriveStatusText(){return gdriveHasToken()?'Connected to Google Drive.':'Not connected.'}
function gdriveAuth(){return new Promise((resolve,reject)=>{
  const cid=gdriveClientId();
  if(!cid){reject(new Error('Please enter your Google OAuth Client ID first.'));return}
  if(!window.google?.accounts?.oauth2){reject(new Error('Google sign-in is still loading. Please wait a moment and try again.'));return}
  const client=google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.file',callback:(resp)=>{if(resp.error){reject(new Error(resp.error));return}gdriveCfg.token=resp.access_token;gdriveCfg.tokenExpiry=Date.now()+Number(resp.expires_in||3600)*1000;saveGDriveCfg();resolve(resp.access_token)}});
  client.requestAccessToken({prompt:gdriveHasToken()?'':'consent'});
})}
async function gdriveToken(){if(gdriveHasToken())return gdriveCfg.token;return await gdriveAuth()}
async function gdriveFetch(url,opts={}){let token=await gdriveToken();let headers=new Headers(opts.headers||{});headers.set('Authorization','Bearer '+token);let r=await fetch(url,{...opts,headers});if(r.status===401){gdriveCfg.token='';gdriveCfg.tokenExpiry=0;saveGDriveCfg();token=await gdriveAuth();headers.set('Authorization','Bearer '+token);r=await fetch(url,{...opts,headers})}if(!r.ok){let t=await r.text();throw new Error(t||('Google Drive error '+r.status))}return r}
async function ensureDriveFolder(){let q=encodeURIComponent("name = 'Sri Square Accounts' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");let r=await gdriveFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&spaces=drive&fields=files(id,name)&pageSize=10');let j=await r.json();if(j.files?.length)return j.files[0].id;let r2=await gdriveFetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Sri Square Accounts',mimeType:'application/vnd.google-apps.folder'})});return (await r2.json()).id}

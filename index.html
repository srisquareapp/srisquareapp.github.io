<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f78"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>SRI SQUARE ACCOUNTS</title>
<style>
:root{--n:#173f78;--p:#6642a6;--bg:#f5f8fc;--line:#dbe4ee;--muted:#66758a;--soft:#edf3f8;--gold:#d2a52b;--red:#b42318;--green:#147a4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.top{background:linear-gradient(135deg,#16477d,#2869b0,#6741a5);color:#fff;padding:26px 18px;box-shadow:0 8px 22px #173f781c}.brand{display:flex;justify-content:center;align-items:center;gap:16px}.brand img{width:70px;height:70px;border-radius:17px}.brand h1{font-size:29px;margin:0;font-weight:850}.brand p{font-size:19px;margin:1px 0 0}.wrap{max-width:920px;margin:auto;padding:18px}.menuBtn,.primary{width:100%;padding:16px 18px;border-radius:18px;background:linear-gradient(135deg,#2366ae,#6641a5);color:#fff;font-weight:850;font-size:19px;box-shadow:0 7px 16px #173f7815}.homebar{display:flex;gap:12px;align-items:center;margin:18px 0}.homebar h2{flex:1;margin:0;color:var(--n);font-size:29px}.secondary,.danger{padding:14px 18px;border-radius:15px;font-weight:800}.secondary{background:var(--soft);color:#214d7e}.danger{background:#fff0ef;color:var(--red)}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;margin-top:16px;box-shadow:0 7px 22px #173f7808}.hero{background:linear-gradient(135deg,#123d69,#17709f 55%,#6040a0);color:#fff;border-radius:25px;padding:25px;margin-top:18px}.hero small{letter-spacing:5px;font-weight:800}.hero h2{font-size:31px;margin:7px 0}.hero p{margin:0;opacity:.9}.stats{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:15px}.stat{padding:19px;border-radius:21px;border:1px solid var(--line)}.stat:nth-child(1){background:#eaf3ff}.stat:nth-child(2){background:#eafbf5}.stat:nth-child(3){background:#fff7df}.stat:nth-child(4){background:#fff0f4}.stat label{font-weight:750;color:#42536a}.stat b{display:block;color:var(--n);font-size:28px;margin-top:8px}.stat small{color:var(--muted)}.title{color:var(--n);font-size:25px;font-weight:850;margin:26px 0 12px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.action{min-height:118px;background:#fff;border:1px solid var(--line);border-radius:20px;color:var(--n);font-weight:850;padding:18px 8px}.action .ico{font-size:29px;margin-bottom:7px}.action small{display:block;color:var(--muted);margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label,label{display:block;font-weight:750;color:#52647a;margin:11px 0 6px}input,select,textarea{width:100%;padding:13px;border:1px solid #cbd7e4;border-radius:13px;background:#fff;color:#172033}textarea{min-height:90px}.notice{background:#fff7df;border-left:5px solid var(--gold);border-radius:12px;padding:14px;color:#6b551d;margin-bottom:15px}.muted{color:var(--muted)}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.chip{background:var(--soft);padding:5px 9px;border-radius:99px;color:#31557c;font-size:13px;font-weight:750}table{width:100%;border-collapse:collapse}td{padding:10px 0;border-bottom:1px dotted #cbd4de}td:last-child{text-align:right;font-weight:800}.total td{border-top:2px solid #182235;border-bottom:2px solid #182235;color:var(--n);font-size:19px}.menuShade,.modal{position:fixed;inset:0;background:#07182aaa;z-index:20}.sheet{width:min(370px,90vw);height:100%;background:#fff;padding:18px;overflow:auto}.sheet h2{color:var(--n)}.menuItem{width:100%;text-align:left;background:var(--soft);color:#214d7e;padding:15px;border-radius:13px;margin:5px 0;font-weight:800}.hidden{display:none!important}.modal{display:flex;align-items:center;justify-content:center;padding:18px}.modalBox{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:22px}.close{float:right;background:var(--soft);padding:8px 12px;border-radius:12px;font-weight:800}.shareGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.brand img{width:62px;height:62px}.brand h1{font-size:24px}.brand p{font-size:17px}.homebar h2{font-size:25px}}
</style></head><body>
<header class="top"><div class="brand"><img src="icon-192.png" alt="SRI SQUARE"><div><h1>SRI SQUARE</h1><p>ACCOUNTS</p></div></div></header>
<div class="wrap"><button class="menuBtn" onclick="openMenu()">☰ &nbsp; Menu</button><main id="app"></main></div>
<div id="menu" class="menuShade hidden" onclick="if(event.target.id==='menu')closeMenu()"><aside class="sheet"><button class="secondary" style="width:100%" onclick="closeMenu();home()">⌂ Home</button><h2>Menu</h2><button class="menuItem" onclick="closeMenu();newBooking()">＋ New Booking</button><button class="menuItem" onclick="closeMenu();bookings()">📋 Bookings</button><button class="menuItem" onclick="closeMenu();customers()">👥 Customers</button><button class="menuItem" onclick="closeMenu();billing()">₹ Customer Billing</button><button class="menuItem" onclick="closeMenu();finance()">▤ Financial</button><button class="menuItem" onclick="closeMenu();cash()">💵 Cash Balance</button><button class="menuItem" onclick="backup()">⬇ Backup Data</button><button class="menuItem" onclick="restore()">⬆ Restore Data</button></aside></div>
<input id="restoreInput" type="file" accept=".json,application/json" class="hidden" onchange="restoreFile(event)"><div id="modal" class="modal hidden"></div>
<script>
const KEY='SRI_SQUARE_ACCOUNTS_FRESH_2026';let db=load();
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.bookings)?x:{bookings:[]}}catch(e){return{bookings:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function $(id){return document.getElementById(id)}function E(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function N(v){return Number(v)||0}function M(v){return '₹'+Math.round(N(v)).toLocaleString('en-IN')}function modes(sel){return ['Cash','UPI','Company Account'].map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}function openMenu(){$('menu').classList.remove('hidden')}function closeMenu(){$('menu').classList.add('hidden')}function bar(t){return `<div class="homebar"><button class="secondary" onclick="home()">← Back</button><h2>${t}</h2><button class="secondary" onclick="home()">⌂ Home</button></div>`}
function bill(b){return N(b.rent)+N(b.water)+N(b.power)*18+(b.other||[]).reduce((s,x)=>s+N(x.amount),0)}function received(b){return N(b.a1)+N(b.a2)+(b.cleared?N(b.final):0)}function cashIn(b){let x=0;if(b.m1==='Cash')x+=N(b.a1);if(b.m2==='Cash')x+=N(b.a2);if(b.cleared&&b.finalMode==='Cash')x+=N(b.final);return x}
function home(){let bs=db.bookings,r=bs.reduce((s,b)=>s+N(b.rent),0),c=bs.reduce((s,b)=>s+cashIn(b),0),d=bs.reduce((s,b)=>s+Math.max(0,bill(b)-received(b)),0);$('app').innerHTML=`<section class="hero"><small>SRI SQUARE</small><h2>Accounts Dashboard</h2><p>Bookings · Customer Billing · Cash · Financial</p></section><div class="stats"><div class="stat"><label>📅 Total Bookings</label><b>${bs.length}</b><small>All bookings</small></div><div class="stat"><label>₹ Booking Amount</label><b>${M(r)}</b><small>Hall rent</small></div><div class="stat"><label>💵 Cash Received</label><b>${M(c)}</b><small>Cash payments only</small></div><div class="stat"><label>📌 Balance Due</label><b>${M(d)}</b><small>Customer pending</small></div></div><div class="title">Quick Actions</div><div class="actions"><button class="action" onclick="newBooking()"><div class="ico">＋</div>New Booking<small>Create booking</small></button><button class="action" onclick="bookings()"><div class="ico">📋</div>Bookings<small>View all</small></button><button class="action" onclick="customers()"><div class="ico">👥</div>Customers<small>Contacts</small></button><button class="action" onclick="billing()"><div class="ico">₹</div>Billing<small>Customer bill</small></button><button class="action" onclick="finance()"><div class="ico">▤</div>Financial<small>Internal only</small></button><button class="action" onclick="cash()"><div class="ico">💵</div>Cash Balance<small>Cash position</small></button></div><div class="card"><div class="title" style="margin-top:0">Recent Bookings</div>${bs.length?bs.slice().reverse().slice(0,5).map(b=>`<div class="item" style="margin-bottom:9px" onclick="openBooking('${E(b.id)}')"><div class="row"><b>${E(b.id)} — ${E(b.customer)}</b><b>${E(b.date)}</b></div><div class="muted">${E(b.event)} · ${M(b.rent)}</div></div>`).join(''):'<p class="muted">No bookings yet.</p>'}</div>`}
function newBooking(){ $('app').innerHTML=bar('New Booking')+`<div class="card"><div class="notice"><b>Create a booking first.</b><br>Customer Billing and Financial are separate and are opened after the booking is saved.</div><div class="grid"><div class="field"><label>Booking / Serial No.</label><input id="bid" placeholder="SS001"></div><div class="field"><label>Event Type</label><input id="event" placeholder="Marriage / Reception"></div><div class="field"><label>Customer Name</label><input id="customer"></div><div class="field"><label>Phone Number</label><input id="phone" inputmode="tel"></div><div class="field"><label>Event Date</label><input id="date" type="date"></div><div class="field"><label>Hall Rent</label><input id="rent" type="number" min="0"></div><div class="field"><label>1st Advance</label><input id="a1" type="number" min="0"></div><div class="field"><label>1st Advance Payment Mode</label><select id="m1">${modes('Cash')}</select></div><div class="field"><label>2nd Advance</label><input id="a2" type="number" min="0"></div><div class="field"><label>2nd Advance Payment Mode</label><select id="m2">${modes('Cash')}</select></div></div><div class="field"><label>Notes / Remarks</label><textarea id="notes"></textarea></div><button class="primary" style="margin-top:12px" onclick="saveBooking()">💾 Save Booking</button></div>`}
function saveBooking(){let id=$('bid').value.trim(),customer=$('customer').value.trim();if(!id)return alert('Enter Booking / Serial No.');if(!customer)return alert('Enter Customer Name.');if(db.bookings.some(b=>b.id.toLowerCase()===id.toLowerCase()))return alert('Booking number already exists.');db.bookings.push({id,event:$('event').value.trim()||'Event',customer,phone:$('phone').value.trim(),date:$('date').value,rent:N($('rent').value),a1:N($('a1').value),m1:$('m1').value,a2:N($('a2').value),m2:$('m2').value,notes:$('notes').value.trim(),water:0,power:0,other:[],final:0,finalMode:'Cash',cleared:false,decoVendor:0,lightVendor:0,decoComm:0,lightComm:0,expenses:[]});save();openBooking(id)}
function bookings(){ $('app').innerHTML=bar('Bookings')+`<div class="card"><input id="bq" placeholder="Search booking / customer / mobile" oninput="renderBookings()"></div><div id="blist" class="list"></div>`;renderBookings()}function renderBookings(){let q=($('bq')?.value||'').toLowerCase(),a=db.bookings.filter(b=>(b.id+' '+b.customer+' '+b.phone).toLowerCase().includes(q));$('blist').innerHTML=a.length?a.slice().reverse().map(b=>`<div class="item"><div class="row"><div><h3 style="margin:0;color:var(--n)">${E(b.id)} — ${E(b.event)}</h3><div>${E(b.customer)} · ${E(b.phone)}</div><small class="muted">${E(b.date)} · Rent ${M(b.rent)}</small></div><button class="secondary" onclick="openBooking('${E(b.id)}')">Open</button></div><div class="shareGrid"><button class="secondary" onclick="shareConfirmation('${E(b.id)}')">💬 Share Confirmation</button><button class="secondary" onclick="shareConfirmation('${E(b.id)}')">🖼️ Confirmation Image</button></div></div>`).join(''):'<div class="card muted">No bookings found.</div>'}
function openBooking(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;$('app').innerHTML=bar(b.id)+`<div class="card"><h2 style="color:var(--n);margin-top:0">${E(b.customer)}</h2><p>${E(b.event)} · ${E(b.date)} · ${E(b.phone)}</p><div class="chips"><span class="chip">Hall Rent ${M(b.rent)}</span><span class="chip">1st Advance ${M(b.a1)} (${E(b.m1)})</span><span class="chip">2nd Advance ${M(b.a2)} (${E(b.m2)})</span></div><div class="shareGrid"><button class="primary" onclick="shareConfirmation('${E(id)}')">💬 Share Booking Confirmation</button><button class="secondary" onclick="shareConfirmation('${E(id)}')">🖼️ Share Confirmation Image</button><button class="secondary" onclick="billing('${E(id)}')">₹ Customer Billing</button><button class="secondary" onclick="finance('${E(id)}')">▤ Financial</button><button class="secondary" onclick="newBookingEdit('${E(id)}')">✏️ Edit Booking</button><button class="danger" onclick="deleteBooking('${E(id)}')">Delete</button></div></div>`}
function newBookingEdit(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;newBooking();$('bid').value=b.id;$('event').value=b.event;$('customer').value=b.customer;$('phone').value=b.phone;$('date').value=b.date;$('rent').value=b.rent;$('a1').value=b.a1;$('m1').value=b.m1;$('a2').value=b.a2;$('m2').value=b.m2;$('notes').value=b.notes||'';document.querySelector('.homebar h2').textContent='Edit Booking';document.querySelector('.primary').onclick=()=>saveBookingEdit(id)}function saveBookingEdit(oldId){let b=db.bookings.find(x=>x.id===oldId);let id=$('bid').value.trim();if(!id||!$('customer').value.trim())return alert('Booking number and customer name are required.');if(id!==oldId&&db.bookings.some(x=>x.id.toLowerCase()===id.toLowerCase()))return alert('Booking number already exists.');Object.assign(b,{id,event:$('event').value.trim()||'Event',customer:$('customer').value.trim(),phone:$('phone').value.trim(),date:$('date').value,rent:N($('rent').value),a1:N($('a1').value),m1:$('m1').value,a2:N($('a2').value),m2:$('m2').value,notes:$('notes').value.trim()});save();openBooking(id)}function deleteBooking(id){if(!confirm('Delete this booking and all its billing/financial data?'))return;db.bookings=db.bookings.filter(b=>b.id!==id);save();bookings()}
function billing(id){$('app').innerHTML=bar('Customer Billing')+`<div class="card"><div class="notice"><b>CUSTOMER BILLING — CUSTOMER USE ONLY</b><br>Decoration and Lighting are not entered or shown here. This section creates the customer bill only.</div><label>Booking Number / Customer Name / Mobile</label><input id="billSearch" value="${E(id||'')}" placeholder="SS001"><button class="primary" style="margin-top:12px" onclick="findBilling()">✏️ Open Billing</button><div id="billMatches" class="list" style="margin-top:12px"></div></div>`;if(id)editBilling(id);else showBillMatches('')}
function showBillMatches(q){q=(q||'').toLowerCase();let a=db.bookings.filter(b=>(b.id+' '+b.customer+' '+b.phone).toLowerCase().includes(q));$('billMatches').innerHTML=a.length?a.map(b=>`<div class="item"><div class="row"><div><b>${E(b.id)} — ${E(b.customer)}</b><div class="muted">${E(b.phone)} · ${E(b.date)}</div></div><button class="secondary" onclick="editBilling('${E(b.id)}')">Open</button></div></div>`).join(''):'<p class="muted">No booking found.</p>'}function findBilling(){let q=$('billSearch').value.trim().toLowerCase(),b=db.bookings.find(x=>x.id.toLowerCase()===q);b?editBilling(b.id):showBillMatches(q)}
function editBilling(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;$('app').innerHTML=bar('Customer Billing')+`<div class="card"><div class="notice"><b>${E(b.id)} — ${E(b.customer)}</b><br>Customer-facing bill only. Decoration and Lighting are excluded.</div><div class="grid"><div class="field"><label>Water</label><input id="bw" type="number" value="${N(b.water)}" min="0"></div><div class="field"><label>Power Units</label><input id="bp" type="number" value="${N(b.power)}" min="0"></div></div><div class="title">Other Charges</div><div id="others">${(b.other||[]).map(x=>`<div class="grid" style="margin-bottom:8px"><input class="on" value="${E(x.name)}" placeholder="Charge name"><input class="oa" type="number" value="${N(x.amount)}" placeholder="Amount"></div>`).join('')}</div><button class="secondary" onclick="addOther()">＋ Add Other Charge</button><div class="title">Final Payment</div><div class="grid"><div class="field"><label>Final Payment Amount</label><input id="bf" type="number" value="${N(b.final)}" min="0"></div><div class="field"><label>Final Payment Mode</label><select id="bfm">${modes(b.finalMode)}</select></div></div><label><input id="bc" type="checkbox" style="width:auto" ${b.cleared?'checked':''}> Payment Cleared</label><div id="bpreview"></div><button class="primary" style="margin-top:12px" onclick="saveBilling('${E(id)}')">💾 Save Billing</button><div class="shareGrid"><button class="secondary" onclick="shareBillImage('${E(id)}')">🖼️ Share Bill Image</button><button class="secondary" onclick="printBill('${E(id)}')">📄 Save / Print Bill</button></div></div>`;['bw','bp','bf'].forEach(k=>$(k).addEventListener('input',()=>previewBilling(b)));previewBilling(b)}
function addOther(){$('others').insertAdjacentHTML('beforeend','<div class="grid" style="margin-bottom:8px"><input class="on" placeholder="Charge name"><input class="oa" type="number" placeholder="Amount"></div>')}function readOther(){return [...document.querySelectorAll('.on')].map((e,i)=>({name:e.value.trim(),amount:N(document.querySelectorAll('.oa')[i].value)})).filter(x=>x.name||x.amount)}function previewBilling(b){let t={...b,water:N($('bw').value),power:N($('bp').value),other:readOther(),final:N($('bf').value)};$('bpreview').innerHTML=`<div class="card" style="background:#f8fbff"><table><tr><td>Customer Bill Total</td><td>${M(bill(t))}</td></tr><tr><td>Amount Received</td><td>${M(received(t))}</td></tr><tr class="total"><td>Balance Due</td><td>${M(Math.max(0,bill(t)-received(t)))}</td></tr></table></div>`}function saveBilling(id){let b=db.bookings.find(x=>x.id===id);b.water=N($('bw').value);b.power=N($('bp').value);b.other=readOther();b.final=N($('bf').value);b.finalMode=$('bfm').value;b.cleared=$('bc').checked;save();editBilling(id);alert('Customer billing saved.')}
function finance(id){$('app').innerHTML=bar('Financial')+`<div class="card"><div class="notice"><b>FINANCIAL — INTERNAL ACCOUNT PURPOSES ONLY</b><br>Customer Billing is separate. Decoration and Lighting vendor totals are entered here, with automatic @30% calculation. Expenses are also entered here.</div><label>Booking Number / Customer Name / Mobile</label><input id="finSearch" value="${E(id||'')}" placeholder="SS001"><button class="primary" style="margin-top:12px" onclick="findFinance()">✏️ Open Financial</button><div id="finMatches" class="list" style="margin-top:12px"></div></div>`;if(id)editFinance(id);else showFinance('')}
function showFinance(q){q=(q||'').toLowerCase();let a=db.bookings.filter(b=>(b.id+' '+b.customer+' '+b.phone).toLowerCase().includes(q));$('finMatches').innerHTML=a.length?a.map(b=>`<div class="item"><div class="row"><div><b>${E(b.id)} — ${E(b.customer)}</b><div class="muted">${E(b.phone)} · ${E(b.date)}</div></div><button class="secondary" onclick="editFinance('${E(b.id)}')">Open</button></div></div>`).join(''):'<p class="muted">No booking found.</p>'}function findFinance(){let q=$('finSearch').value.trim().toLowerCase(),b=db.bookings.find(x=>x.id.toLowerCase()===q);b?editFinance(b.id):showFinance(q)}
function editFinance(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;b.expenses=b.expenses||[];$('app').innerHTML=bar('Financial')+`<div class="card"><div class="notice"><b>${E(b.id)} — ${E(b.customer)}</b><br>Internal account. Final customer payment is not shown as a Financial line.</div><div class="grid"><div class="field"><label>Decoration Total (Vendor)</label><input id="fd" type="number" value="${N(b.decoVendor)}" min="0" oninput="calc30()"><small class="muted">Enter vendor total → @30% auto-calculates.</small></div><div class="field"><label>Decoration @30%</label><input id="fdc" type="number" value="${N(b.decoComm)}" min="0"></div><div class="field"><label>Lighting Total (Vendor)</label><input id="fl" type="number" value="${N(b.lightVendor)}" min="0" oninput="calc30()"><small class="muted">Enter vendor total → @30% auto-calculates.</small></div><div class="field"><label>Lighting @30%</label><input id="flc" type="number" value="${N(b.lightComm)}" min="0"></div><div class="field"><label>Water</label><input id="fw" type="number" value="${N(b.water)}" min="0"></div><div class="field"><label>Power Units</label><input id="fp" type="number" value="${N(b.power)}" min="0"></div></div><div class="title">Expenses</div><div class="notice">Enter every internal expense for this booking below. These expenses are deducted from Financial Balance and Cash Balance when applicable.</div><div id="expenses">${(b.expenses||[]).map(x=>`<div class="grid" style="margin-bottom:8px"><input class="en" value="${E(x.name)}" placeholder="Expense name"><input class="ea" type="number" value="${N(x.amount)}" placeholder="Amount"></div>`).join('')}</div><button class="secondary" onclick="addExpense()">＋ Add Expense</button><div id="fpreview"></div><button class="primary" style="margin-top:12px" onclick="saveFinance('${E(id)}')">💾 Save Financial</button><div class="shareGrid"><button class="secondary" style="width:100%;margin-top:10px" onclick="printFinance('${E(id)}')">📄 Save / Print Financial</button><button class="secondary" style="width:100%;margin-top:10px" onclick="shareFinance('${E(id)}')">🖼️ Share Financial + Expenses</button></div></div>`;calc30();calcFinance(b)}
function calc30(){if($('fdc'))$('fdc').value=Math.round(N($('fd').value)*.30);if($('flc'))$('flc').value=Math.round(N($('fl').value)*.30);let id=$('expenses')?.closest('.card')?.querySelector('.notice b')?.textContent?.split(' — ')[0];let b=db.bookings.find(x=>x.id===id);if(b)calcFinance(b)}function addExpense(){$('expenses').insertAdjacentHTML('beforeend','<div class="grid" style="margin-bottom:8px"><input class="en" placeholder="Expense name"><input class="ea" type="number" placeholder="Amount"></div>')}function readExpenses(){return [...document.querySelectorAll('.en')].map((e,i)=>({name:e.value.trim(),amount:N(document.querySelectorAll('.ea')[i].value)})).filter(x=>x.name||x.amount)}function calcFinance(b){if(!$('fpreview'))return;let t=N(b.rent)+N($('fw')?.value)+N($('fp')?.value)*18+N($('fdc')?.value)+N($('flc')?.value),e=readExpenses().reduce((s,x)=>s+N(x.amount),0);$('fpreview').innerHTML=`<div class="card" style="background:#f8fbff"><table><tr><td>Financial Total</td><td>${M(t)}</td></tr><tr><td>Expenses</td><td>− ${M(e)}</td></tr><tr class="total"><td>Financial Balance</td><td>${M(t-e)}</td></tr><tr><td>1st Advance Received</td><td>${M(b.a1)} (${E(b.m1)})</td></tr><tr><td>2nd Advance Received</td><td>${M(b.a2)} (${E(b.m2)})</td></tr></table></div>`}function saveFinance(id){let b=db.bookings.find(x=>x.id===id);b.decoVendor=N($('fd').value);b.decoComm=N($('fdc').value);b.lightVendor=N($('fl').value);b.lightComm=N($('flc').value);b.water=N($('fw').value);b.power=N($('fp').value);b.expenses=readExpenses();save();editFinance(id);alert('Financial saved.')}
function cash(){let cin=db.bookings.reduce((s,b)=>s+cashIn(b),0),exp=db.bookings.reduce((s,b)=>s+(b.expenses||[]).reduce((a,x)=>a+N(x.amount),0),0);$('app').innerHTML=bar('Cash Balance')+`<div class="card"><div class="notice"><b>Physical cash only.</b><br>UPI and Company Account receipts do not increase physical cash. Customer balance is not cash until actually paid.</div><table><tr><td>Cash Received</td><td>${M(cin)}</td></tr><tr><td>Cash Expenses</td><td>− ${M(exp)}</td></tr><tr class="total"><td>Total Cash Available</td><td>${M(cin-exp)}</td></tr></table></div>`}
function customers(){$('app').innerHTML=bar('Customers')+`<div class="card"><input id="cq" placeholder="Search name / mobile / booking" oninput="renderCustomers()"></div><div id="cus" class="list"></div>`;renderCustomers()}function renderCustomers(){let q=($('cq')?.value||'').toLowerCase(),a=db.bookings.filter(b=>(b.customer+' '+b.phone+' '+b.id).toLowerCase().includes(q));$('cus').innerHTML=a.length?a.map(b=>`<div class="item"><b>${E(b.customer)}</b><div>${E(b.phone)} · ${E(b.id)}</div><div class="shareGrid"><button class="secondary" onclick="location.href='tel:${E(b.phone)}'">📞 Call</button><button class="secondary" onclick="location.href='https://wa.me/91${E(b.phone)}'">💬 WhatsApp</button></div></div>`).join(''):'<p class="muted">No customers.</p>'}
function backup(){let p={format:'SRI SQUARE ACCOUNTS BACKUP',version:'fresh-2026',createdAt:new Date().toISOString(),data:db},blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='SRI_SQUARE_ACCOUNTS_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function restore(){$('restoreInput').click()}function restoreFile(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!Array.isArray(d.bookings))throw 0;db={bookings:d.bookings};db.bookings.forEach(b=>{b.expenses=b.expenses||[]});save();home();alert('Backup restored successfully.')}catch(err){alert('Invalid SRI SQUARE ACCOUNTS backup file.')}e.target.value=''};r.readAsText(f)}
function confirmationLines(b){return['SRI SQUARE CONVENTION','BOOKING CONFIRMATION','Booking ID: '+b.id,'Customer: '+b.customer,'Mobile: '+b.phone,'Event: '+b.event,'Event Date: '+b.date,'','Hall Rent: '+M(b.rent),'1st Advance: '+M(b.a1)+' ('+b.m1+')','2nd Advance: '+M(b.a2)+' ('+b.m2+')','Total Advance Paid: '+M(N(b.a1)+N(b.a2)),'Balance Pending: '+M(Math.max(0,N(b.rent)-N(b.a1)-N(b.a2))),'',b.notes?'Remarks: '+b.notes:'','TERMS & CONDITIONS','50% advance is required to block the date. Booking amount is non-refundable; date change is subject to availability.','Final bill is based on actual usage including electricity, diesel, personnel and other applicable charges.','Balance payment must be cleared before the event. Any damage to hall property, furniture, electrical items, washrooms, dining tables or chairs will be charged at actual cost.','Hall timing is strict and limited to the booked 12-hour period. Extra hours are subject to availability and applicable charges.','Waste handling and excess cleaning charges may apply where required. Firecrackers, open flames and gas cylinders are not permitted without management approval.','Management is not responsible for parking vehicle damage or theft. Payments are accepted by Cash, UPI or Bank Transfer.','GST, if applicable, will be charged extra. Management reserves the right to modify terms without notice.','','Thank you for choosing SRI SQUARE CONVENTION.','Contact: 8801234288 / 9121013113']}
function billLines(b){let a=[`SRI SQUARE ACCOUNTS`,`CUSTOMER BILL`,`Booking: ${b.id}`,`Customer: ${b.customer}`,`Phone: ${b.phone}`,`Event: ${b.event}`,`Date: ${b.date}`,'',`Hall Rent: ${M(b.rent)}`,`Water: ${M(b.water)}`,`Power: ${N(b.power)} × ₹18 = ${M(N(b.power)*18)}`,...(b.other||[]).map(x=>`${x.name}: ${M(x.amount)}`),'',`TOTAL: ${M(bill(b))}`,`AMOUNT RECEIVED: ${M(received(b))}`,`BALANCE DUE: ${M(Math.max(0,bill(b)-received(b)))}`];return a}
async function shareImage(lines,filename,title){let c=document.createElement('canvas'),x=c.getContext('2d'),pad=58,maxW=884,lineH=38; c.width=1000; x.textBaseline='top'; let blocks=[]; for(let i=0;i<lines.length;i++){let text=String(lines[i]??''); if(!text){blocks.push({blank:true});continue} let font=i===0?'800 42px Arial':(i===1?'800 30px Arial':'26px Arial'); x.font=font; let words=text.split(/\s+/),cur='',wrapped=[]; for(const w of words){let test=cur?cur+' '+w:w;if(x.measureText(test).width>maxW&&cur){wrapped.push(cur);cur=w}else cur=test} if(cur)wrapped.push(cur); blocks.push({font,lines:wrapped})} let height=70; for(const b of blocks)height+=b.blank?18:(b.lines.length*lineH+12); c.height=Math.max(650,height+55); x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height); let y=38; for(let i=0;i<blocks.length;i++){let b=blocks[i]; if(b.blank){y+=18;continue} x.font=b.font;x.fillStyle=i<2?'#173f78':'#172033'; for(const line of b.lines){x.fillText(line,pad,y);y+=lineH} y+=12} c.toBlob(async blob=>{let file=new File([blob],filename,{type:'image/png'});try{if(navigator.share){await navigator.share({files:[file],title})}else throw 0}catch(e){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),500);alert('Image saved. You can share it from Photos.')}} ,'image/png')}
function shareConfirmation(id){let b=db.bookings.find(x=>x.id===id);if(b)shareImage(confirmationLines(b),'SRI_SQUARE_Booking_Confirmation.png','SRI SQUARE Booking Confirmation')}
function shareBillImage(id){let b=db.bookings.find(x=>x.id===id);if(b)shareImage(billLines(b),'SRI_SQUARE_Customer_Bill.png','SRI SQUARE Customer Bill')}
function printBill(id){let b=db.bookings.find(x=>x.id===id);printWin('Customer Bill',billLines(b))}function financeLines(b){let t=N(b.rent)+N(b.water)+N(b.power)*18+N(b.decoComm)+N(b.lightComm),e=(b.expenses||[]).reduce((s,x)=>s+N(x.amount),0);return[`SRI SQUARE ACCOUNTS`,`FINANCIAL — INTERNAL`,`Booking: ${b.id}`,`Customer: ${b.customer}`,`Date: ${b.date}`,'',`Hall Rent: ${M(b.rent)}`,`Water: ${M(b.water)}`,`Power: ${N(b.power)} × ₹18 = ${M(N(b.power)*18)}`,`Decoration @30%: ${M(b.decoComm)}`,`Lighting @30%: ${M(b.lightComm)}`,`Financial Total: ${M(t)}`,'','EXPENSES',...(b.expenses||[]).map(x=>`${x.name || 'Expense'}: ${M(x.amount)}`),`Total Expenses: − ${M(e)}`,`Financial Balance: ${M(t-e)}`,'',`1st Advance: ${M(b.a1)} (${b.m1})`,`2nd Advance: ${M(b.a2)} (${b.m2})`] }function shareFinance(id){let b=db.bookings.find(x=>x.id===id);if(b)shareImage(financeLines(b),'SRI_SQUARE_Financial_Report.png','SRI SQUARE Financial + Expenses')}function printFinance(id){let b=db.bookings.find(x=>x.id===id);if(b)printWin('Financial',financeLines(b))}function printWin(title,lines){let w=window.open('','_blank');if(!w)return alert('Please allow pop-ups for printing.');w.document.write(`<html><head><title>${title}</title><style>body{font-family:Arial;padding:30px;line-height:1.7}h1{color:#173f78}p{margin:8px 0}</style></head><body>${lines.map(x=>`<p>${E(x)||'&nbsp;'}</p>`).join('')}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
